<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <style>
      @keyframes slowRotateClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes slowRotateCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        30% { opacity: 0.45; }
        70% { opacity: 0.45; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes textCycle1 {
        0%, 25% { opacity: 1; }
        28%, 50% { opacity: 0; }
        53%, 75% { opacity: 0; }
        78%, 100% { opacity: 0; }
      }
      @keyframes textCycle2 {
        0%, 25% { opacity: 0; }
        28%, 50% { opacity: 1; }
        53%, 75% { opacity: 0; }
        78%, 100% { opacity: 0; }
      }
      @keyframes textCycle3 {
        0%, 50% { opacity: 0; }
        53%, 75% { opacity: 1; }
        78%, 100% { opacity: 0; }
      }
      @keyframes textCycle4 {
        0%, 75% { opacity: 0; }
        78%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }

      .disk-outer {
        transform-origin: 140px 150px;
        animation: slowRotateClockwise 26s linear infinite;
      }
      .disk-inner {
        transform-origin: 140px 150px;
        animation: slowRotateCounter 16s linear infinite;
      }
      .radar-sweep {
        transform-origin: 140px 150px;
        animation: radarSweep 4s linear infinite;
      }
      .core-pulse {
        transform-origin: 140px 150px;
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .scan-beam {
        animation: scanBeam 4.5s ease-in-out infinite;
      }

      .cycle-1 { animation: textCycle1 12s infinite; }
      .cycle-2 { animation: textCycle2 12s infinite; }
      .cycle-3 { animation: textCycle3 12s infinite; }
      .cycle-4 { animation: textCycle4 12s infinite; }

      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: -0.04em;
        fill: #f4f3ee;
      }
      .code-font {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      }
    </style>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#111114" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <linearGradient id="radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridPattern" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" fill-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="300" rx="16" fill="url(#bgGradient)" stroke="#27272a" stroke-width="1.5" />
  <rect width="900" height="300" rx="16" fill="url(#gridPattern)" />

  <!-- LEFT: Precision Holographic HUD Reticle -->
  <g>
    <!-- Background sector panel -->
    <rect x="40" y="50" width="200" height="200" rx="12" fill="#0d0d10" stroke="#27272a" stroke-width="1" />

    <!-- Circular reference guides -->
    <circle cx="140" cy="150" r="85" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="140" cy="150" r="60" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="140" cy="150" r="36" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.6" />

    <!-- Scanning beam vertically moving -->
    <rect x="41" y="60" width="198" height="20" fill="url(#beamGradient)" class="scan-beam" />

    <!-- Outer segmented rotating ring -->
    <g class="disk-outer">
      <circle cx="140" cy="150" r="82" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="20 14 36 10 6 12" stroke-linecap="round" />
      <circle cx="140" cy="150" r="82" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="32 180" stroke-linecap="round" />
    </g>

    <!-- Inner counter-rotating ring -->
    <g class="disk-inner">
      <circle cx="140" cy="150" r="56" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="12 20 28 16" stroke-linecap="round" />
      <circle cx="140" cy="150" r="56" fill="none" stroke="#f4f3ee" stroke-width="2" stroke-dasharray="16 140" stroke-linecap="round" />
    </g>

    <!-- Radar sweeping beam sector -->
    <g class="radar-sweep">
      <path d="M 140 150 L 140 65 A 85 85 0 0 1 200 90 Z" fill="url(#radarGradient)" />
      <line x1="140" y1="150" x2="140" y2="65" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Core glowing reactor -->
    <circle cx="140" cy="150" r="14" fill="#10b981" fill-opacity="0.25" class="core-pulse" />
    <circle cx="140" cy="150" r="7" fill="#10b981" />
    <circle cx="140" cy="150" r="3" fill="#f4f3ee" />

    <!-- Corner alignment brackets -->
    <path d="M 48 62 L 48 56 L 54 56" fill="none" stroke="#52525b" stroke-width="1.5" />
    <path d="M 232 62 L 232 56 L 226 56" fill="none" stroke="#52525b" stroke-width="1.5" />
    <path d="M 48 238 L 48 244 L 54 244" fill="none" stroke="#52525b" stroke-width="1.5" />
    <path d="M 232 238 L 232 244 L 226 244" fill="none" stroke="#52525b" stroke-width="1.5" />

    <!-- Sector telemetry label -->
    <text x="140" y="235" text-anchor="middle" class="code-font" font-size="9" fill="#71717a" letter-spacing="0.1em">STATUS: OPERATIONAL // 0xVALK</text>
  </g>

  <!-- RIGHT: Typography & Live Interactive Showcase -->
  <g transform="translate(280, 0)">
    <!-- Identity Badge -->
    <g transform="translate(0, 46)">
      <rect width="210" height="22" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#10b981" />
      <text x="24" y="15" class="code-font" font-size="10" font-weight="600" fill="#a1a1aa" letter-spacing="0.08em">DEVELOPER // @vescofr-oxy</text>
    </g>

    <!-- Primary Hero Heading -->
    <text x="0" y="106" class="hero-title">Valk</text>

    <!-- Subtitle Focus -->
    <text x="0" y="128" class="code-font" font-size="12.5" font-weight="500" fill="#a1a1aa" letter-spacing="0.04em">
      SYSTEMS ARCHITECTURE, MODERN WEB &amp; REVERSE ENGINEERING
    </text>

    <!-- Terminal Command Loop Box -->
    <g transform="translate(0, 146)">
      <rect width="570" height="42" rx="6" fill="#0d0d10" stroke="#27272a" stroke-width="1" />
      
      <text x="14" y="26" class="code-font" font-size="13" font-weight="600" fill="#10b981">$</text>
      
      <!-- Command 1: OmniLens -->
      <g class="cycle-1">
        <text x="32" y="26" class="code-font" font-size="13" fill="#f4f3ee">omnilens --inspect live</text>
        <text x="240" y="26" class="code-font" font-size="11" fill="#71717a"># in-page web intelligence &amp; diagnostics</text>
      </g>
      
      <!-- Command 2: Smart File Cleaner -->
      <g class="cycle-2">
        <text x="32" y="26" class="code-font" font-size="13" fill="#f4f3ee">sfc clean ~/Downloads --execute</text>
        <text x="340" y="26" class="code-font" font-size="11" fill="#71717a"># safe disk cleanup &amp; 3-tier dedupe</text>
      </g>

      <!-- Command 3: Stack -->
      <g class="cycle-3">
        <text x="32" y="26" class="code-font" font-size="13" fill="#f4f3ee">cat ~/.stack.json | jq .primary</text>
        <text x="310" y="26" class="code-font" font-size="11" fill="#71717a"># python, typescript, rust, linux</text>
      </g>

      <!-- Command 4: Uptime -->
      <g class="cycle-4">
        <text x="32" y="26" class="code-font" font-size="13" fill="#f4f3ee">uptime --pretty &amp;&amp; status</text>
        <text x="260" y="26" class="code-font" font-size="11" fill="#71717a"># up 24/7, actively building &amp; shipping</text>
      </g>

      <rect x="548" y="16" width="7" height="14" rx="1" fill="#10b981" class="cursor" />
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 212)">
      <!-- Pill 1: Systems & CLI -->
      <rect x="0" y="0" width="134" height="26" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="16" cy="13" r="3" fill="#10b981" />
      <text x="28" y="17" class="code-font" font-size="10.5" font-weight="600" fill="#f4f3ee">SYSTEMS &amp; CLI</text>

      <!-- Pill 2: Browser Ext -->
      <rect x="144" y="0" width="168" height="26" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="160" cy="13" r="3" fill="#06b6d4" />
      <text x="172" y="17" class="code-font" font-size="10.5" font-weight="600" fill="#f4f3ee">BROWSER EXTENSIONS</text>

      <!-- Pill 3: In-Page DevTools -->
      <rect x="322" y="0" width="144" height="26" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="338" cy="13" r="3" fill="#a78bfa" />
      <text x="350" y="17" class="code-font" font-size="10.5" font-weight="600" fill="#f4f3ee">WEB DIAGNOSTICS</text>

      <!-- Pill 4: Linux First -->
      <rect x="476" y="0" width="94" height="26" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="492" cy="13" r="3" fill="#f59e0b" />
      <text x="504" y="17" class="code-font" font-size="10.5" font-weight="600" fill="#f4f3ee">LINUX</text>
    </g>

    <!-- Platform Telemetry Footer -->
    <text x="0" y="262" class="code-font" font-size="10" font-weight="500" fill="#71717a" letter-spacing="0.08em">
      PRIMARY STACK: PYTHON | TYPESCRIPT | JAVASCRIPT | BASH | LINUX SYSTEMS
    </text>
  </g>
</svg>
