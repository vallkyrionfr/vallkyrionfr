    <text x="0" y="0"><tspan class="c-green" font-weight="700">vallkyrion@valk</tspan><tspan class="c-dim">:</tspan><tspan class="c-accent" font-weight="700">~</tspan><tspan class="c-fg">$ fastfetch</tspan></text>

