<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="540">
  <defs>
    <style>
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
      .mono {
        font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.4;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        fill: #8b949e;
        font-weight: 500;
      }
      .c-dim    { fill: #484f58; }
      .c-muted  { fill: #8b949e; }
      .c-fg     { fill: #e6edf3; }
      .c-accent { fill: #58a6ff; }
      .c-green  { fill: #3fb950; }
      .c-cyan   { fill: #39c5cf; }
      .c-purple { fill: #bc8cff; }
      .c-yellow { fill: #d29922; }
      .c-red    { fill: #ff7b72; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="918" height="538" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Window Titlebar -->
  <path d="M 1 9 C 1 4.5 4.5 1 9 1 L 909 1 C 913.5 1 917 4.5 917 9 L 917 36 L 1 36 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <line x1="1" y1="36" x2="919" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="460" y="22" text-anchor="middle" class="title">vallkyrion@valk: ~</text>

  <!-- Terminal Content Area -->
  <g transform="translate(32, 62)" class="mono">

