        <rect x="56"  y="15" width="22" height="11" rx="2" fill="#56d364" />
        <rect x="84"  y="15" width="22" height="11" rx="2" fill="#e3b341" />
        <rect x="112" y="15" width="22" height="11" rx="2" fill="#79c0ff" />
